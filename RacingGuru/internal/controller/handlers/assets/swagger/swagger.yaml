basePath: /
definitions:
  handlers.ChangePasswordRequest:
    properties:
      password:
        example: newSecret123
        type: string
    type: object
  handlers.AuthUserResponse:
    properties:
      email:
        example: user@example.com
        type: string
      name:
        example: Max Verstappen
        type: string
      role:
        allOf:
        - $ref: '#/definitions/models.Role'
        enum:
        - admin
        - user
        example: user
    type: object
  handlers.GenerateAdminSecretResponse:
    properties:
      secret:
        example: WQ3mYvB1d8jK2s4Qn7LpT0xZc5RaE9Uf
        type: string
    type: object
  handlers.DriverStatsResponse:
    properties:
      driver_stats:
        $ref: '#/definitions/models.DriverStats'
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        properties:
          code:
            type: string
          message:
            type: string
        type: object
    type: object
  handlers.LoginRequest:
    properties:
      email:
        example: user@example.com
        type: string
      password:
        example: secret123
        type: string
    type: object
  handlers.RegisterRequest:
    properties:
      email:
        example: user@example.com
        type: string
      name:
        example: Max Verstappen
        type: string
      password:
        example: secret123
        type: string
      secret:
        example: WQ3mYvB1d8jK2s4Qn7LpT0xZc5RaE9Uf
