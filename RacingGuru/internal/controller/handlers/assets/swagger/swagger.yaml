        type: array
      id:
        type: string
      number:
        type: string
      team_id:
        type: string
    type: object
  models.ConditionOperator:
    enum:
    - gt
    - lt
    - gte
    - lte
    - eq
    type: string
    x-enum-varnames:
    - ConditionOperatorGT
    - ConditionOperatorLT
    - ConditionOperatorGTE
    - ConditionOperatorLTE
    - ConditionOperatorEQ
  models.Driver:
    properties:
      birthday:
        type: string
      id:
        type: string
      name:
        type: string
      nationality:
        type: string
    type: object
  models.DriverStats:
    properties:
      driver:
        $ref: '#/definitions/models.Driver'
      stats:
        $ref: '#/definitions/models.Stats'
    type: object
  models.MatrixDrivers:
    properties:
      condition_specs:
        items:
          items:
            $ref: '#/definitions/models.SudokuCondition'
          type: array
        type: array
      field:
        items:
          items:
            items:
              $ref: '#/definitions/models.Driver'
            type: array
          type: array
        type: array
    type: object
  models.MatrixTeams:
    properties:
      condition_specs:
        items:
          items:
            $ref: '#/definitions/models.SudokuCondition'
          type: array
        type: array
      field:
        items:
          items:
            items:
              $ref: '#/definitions/models.Team'
            type: array
          type: array
        type: array
    type: object
  models.Race:
    properties:
      championship_id:
        type: string
      date:
        type: string
      duration:
        type: integer
      id:
        type: string
      name:
        type: string
      track:
        $ref: '#/definitions/models.Track'
      type:
        type: integer
    type: object
  models.RaceResult:
    properties:
